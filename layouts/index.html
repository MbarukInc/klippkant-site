<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default "en" }}">
  <head>
    {{ partial "kk-head.html" . }}
  </head>
  <body>
    <main>
      <p class="eyebrow">{{ site.Params.eyebrow }}</p>
      <h1>{{ site.Title }}</h1>
      <p class="tagline">{{ site.Params.tagline }}</p>
      <p class="contact"><a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a></p>
    </main>
    <footer>&copy; {{ now.Year }} {{ site.Title }}</footer>
  </body>
</html>
